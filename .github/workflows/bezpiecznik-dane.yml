# Bezpiecznik (projekt 13): co godzinę pobiera listy domen oszustów (CERT Polska, Phishing.Database),
# dzieli je na 1024 małe porcje i odkłada na gałąź „bezpiecznik-dane”. Strona czyta porcje przez
# raw.githubusercontent.com (z nagłówkiem CORS). Gałąź ma zawsze jeden commit, więc historia nie rośnie.
name: Bezpiecznik – listy oszustów

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bezpiecznik-dane
  cancel-in-progress: true

jobs:
  dane:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - name: Zbuduj porcje
        run: python3 .github/scripts/bezpiecznik_dane.py "$RUNNER_TEMP/dane"
      - name: Wypchnij na gałąź bezpiecznik-dane
        working-directory: ${{ runner.temp }}/dane
        run: |
          git init -q -b bezpiecznik-dane
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Listy oszustów $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" bezpiecznik-dane
